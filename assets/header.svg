<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Silvano Moraes de Souza, Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect x="96" y="178" height="48" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;284;284;0;0" keyTimes="0;0.02;0.14;0.28;0.32;1" calcMode="linear"/></rect></clipPath>
    <clipPath id="c2"><rect x="96" y="178" height="48" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;564;564;0;0" keyTimes="0;0.35;0.48;0.61;0.65;1"/></rect></clipPath>
    <clipPath id="c3"><rect x="96" y="178" height="48" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;498;498;0;0" keyTimes="0;0.68;0.81;0.94;0.98;1"/></rect></clipPath>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .node { animation: glow 3s ease-in-out infinite; }
      .node:nth-of-type(2) { animation-delay: .6s; } .node:nth-of-type(3) { animation-delay: 1.2s; }
      .node:nth-of-type(4) { animation-delay: 1.8s; } .node:nth-of-type(5) { animation-delay: 2.4s; }
      @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)" opacity="0.6"/>

  <!-- pipeline on the right: source -> etl -> db -> api -> dashboard -->
  <g transform="translate(900 70)">
    <path class="flow" d="M20 80 H300" stroke="#3fb950" stroke-width="3" fill="none"/>
    <g class="sans" font-size="11" fill="#8b949e" text-anchor="middle">
      <circle class="node" cx="20" cy="80" r="16" fill="#1f6feb"/><text x="20" y="120">ERP</text>
      <circle class="node" cx="90" cy="80" r="16" fill="#3fb950"/><text x="90" y="120">ETL</text>
      <circle class="node" cx="160" cy="80" r="16" fill="#a371f7"/><text x="160" y="120">SQL</text>
      <circle class="node" cx="230" cy="80" r="16" fill="#f78166"/><text x="230" y="120">API</text>
      <circle class="node" cx="300" cy="80" r="16" fill="#d29922"/><text x="300" y="120">BI / AI</text>
    </g>
  </g>

  <text x="96" y="84" class="mono" font-size="16" fill="#3fb950" letter-spacing="2">$ whoami</text>
  <text x="92" y="150" class="sans" font-size="58" font-weight="800" fill="url(#name)">Silvano Moraes de Souza</text>

  <g class="mono" font-size="30" fill="#e6edf3">
    <text x="96" y="214" clip-path="url(#c1)">Software Engineer</text>
    <text x="96" y="214" clip-path="url(#c2)">Python · APIs · Data in production</text>
    <text x="96" y="214" clip-path="url(#c3)">Building 30 systems in 30 days</text>
  </g>
  <rect class="cursor" x="96" y="190" width="14" height="30" fill="#3fb950" opacity="0.9">
    <animate attributeName="x" dur="12s" repeatCount="indefinite"
      values="96;96;386;386;96;96;666;666;96;96;600;600;96;96"
      keyTimes="0;0.02;0.14;0.28;0.32;0.35;0.48;0.61;0.65;0.68;0.81;0.94;0.98;1"/>
  </rect>

  <text x="96" y="262" class="sans" font-size="16" fill="#8b949e">Sorocaba, Brazil · ETL · PostgreSQL · FastAPI · Docker · LLM agents</text>
</svg>
