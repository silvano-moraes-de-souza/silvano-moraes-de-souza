<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-label="Impact: 60% faster monthly close, 80% of reports automated, route planning from 3 hours to 2 minutes, 19.5 million rows generated in 24 seconds">
  <style>
    .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
    .card { opacity: 0; animation: rise .8s ease-out forwards; }
    .c2 { animation-delay: .25s; } .c3 { animation-delay: .5s; } .c4 { animation-delay: .75s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.6s ease-out forwards; }
    .b1 { animation-delay: .6s; } .b2 { animation-delay: .85s; } .b3 { animation-delay: 1.1s; } .b4 { animation-delay: 1.35s; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect width="1280" height="220" rx="16" fill="#0d1117"/>

  <g class="card c1">
    <rect x="24" y="24" width="296" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="48" y="92" class="sans" font-size="52" font-weight="800" fill="#58a6ff">60%</text>
    <text x="48" y="124" class="sans" font-size="15" fill="#e6edf3">faster monthly close</text>
    <text x="48" y="146" class="sans" font-size="13" fill="#8b949e">ERP → PostgreSQL ETL, in production</text>
    <rect x="48" y="166" width="248" height="6" rx="3" fill="#21262d"/>
    <rect class="bar b1" x="48" y="166" width="149" height="6" rx="3" fill="#58a6ff"/>
  </g>
  <g class="card c2">
    <rect x="336" y="24" width="296" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="360" y="92" class="sans" font-size="52" font-weight="800" fill="#3fb950">80%</text>
    <text x="360" y="124" class="sans" font-size="15" fill="#e6edf3">of recurring reports automated</text>
    <text x="360" y="146" class="sans" font-size="13" fill="#8b949e">SQL analytics + web dashboard</text>
    <rect x="360" y="166" width="248" height="6" rx="3" fill="#21262d"/>
    <rect class="bar b2" x="360" y="166" width="198" height="6" rx="3" fill="#3fb950"/>
  </g>
  <g class="card c3">
    <rect x="648" y="24" width="296" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="672" y="92" class="sans" font-size="46" font-weight="800" fill="#f78166">3h → 2min</text>
    <text x="672" y="124" class="sans" font-size="15" fill="#e6edf3">to plan a day of deliveries</text>
    <text x="672" y="146" class="sans" font-size="13" fill="#8b949e">route optimization + offline app</text>
    <rect x="672" y="166" width="248" height="6" rx="3" fill="#21262d"/>
    <rect class="bar b3" x="672" y="166" width="245" height="6" rx="3" fill="#f78166"/>
  </g>
  <g class="card c4">
    <rect x="960" y="24" width="296" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="984" y="92" class="sans" font-size="52" font-weight="800" fill="#d29922">19.5M</text>
    <text x="984" y="124" class="sans" font-size="15" fill="#e6edf3">rows generated in 24 s</text>
    <text x="984" y="146" class="sans" font-size="13" fill="#8b949e">shopflow-datagen, measured</text>
    <rect x="984" y="166" width="248" height="6" rx="3" fill="#21262d"/>
    <rect class="bar b4" x="984" y="166" width="248" height="6" rx="3" fill="#d29922"/>
  </g>
</svg>
